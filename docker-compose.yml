services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swell}
      POSTGRES_DB: ${POSTGRES_DB:-swell_engine}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swell}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swell}:${POSTGRES_PASSWORD:-swell}@postgres:5432/${POSTGRES_DB:-swell_engine}
      REDIS_URL: redis://redis:6379
      SERVER_HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  postgres_data:
