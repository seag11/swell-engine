x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:18-alpine
    container_name: swell-postgres
    restart: on-failure
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swell}
      POSTGRES_DB: ${POSTGRES_DB:-swell_engine}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # pg18+ wants the mount here, not at /data — it nests version-specific dirs below
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swell}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: swell-redis
    logging: *default-logging
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    container_name: swell-server
    restart: on-failure
    logging: *default-logging
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swell}:${POSTGRES_PASSWORD:-swell}@postgres:5432/${POSTGRES_DB:-swell_engine}
      REDIS_URL: redis://redis:6379
      SERVER_HOST: 0.0.0.0
      PORT: 3000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      BETA_TOKENS: '${BETA_TOKENS:-[]}'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    container_name: swell-client
    restart: on-failure
    logging: *default-logging
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  postgres_data:
