name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `ci` rather than `install` so a stale lockfile fails the build instead of
      # being silently rewritten.
      - run: npm ci

      - name: Typecheck and build all packages
        run: npm run build

  # Separate from the Node build so that moving swellkit into its own
  # repository later removes this job along with the directory.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: swellkit
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen fails on a stale lockfile rather than silently resolving a
      # different dependency set, matching what `npm ci` does for the Node side.
      - run: uv sync --frozen

      - name: Equivalence and property tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .
